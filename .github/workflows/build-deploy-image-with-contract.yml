name: Smart Contract Image Build
run-name: ${{ github.actor }} building smart contract geth image
on: 
  push:
    branches:
      - test-branch
  pull_request:
    # types: [closed] # trigger only on closed pull reqeusts
    branches:
      - test-branch
  workflow_dispatch: # allow manual rebuilds

# Docs/Guide provides info that ghcr is supported out of the box with the docker actions + recommend usage of action sha.

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  Build-Contract-Container-Image:
    runs-on: ubuntu-latest

    # if: >
    #   github.event.pull_request.merged == true &&
    #   contains(github.event.pull_request.labels.*.name, 'CI:Deploy')

    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

    # start the latest version of our geth build image
      - name: Start geth container
        run: |
          docker run -d --name geth \
            -p 8545:8545 \
            ghcr.io/m0sh1x2/go-ethereum:master \
            geth --dev \
            --http \
            --http.addr 0.0.0.0 \
            --http.api eth,web3,debug,net \
            --http.vhosts="*" \
            --allow-insecure-unlock

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: hardhat/package-lock.json
          
      - name: Deploy contract
        run: |
          docker ps
          cd hardhat
          npm ci
          npx hardhat run scripts/deploy-counter.ts --network geth

