
services:
  geth:
    image: go-etherium:0.0.1-all-tools
    # geth --dev --http --http.api eth,web3,net --http.corsdomain "https://remix.ethereum.org"

    # --http # works in localhost but doesn't listen on the public address
    # command:  >
    #   geth
    #   --dev 
    #   --http
    #   --http.addr 0.0.0.0 
    #   --http.api eth,web3,debug,net 
    #   --http.corsdomain "https://remix.ethereum.org"
    #   --datadir=/root/.ethereum
    #   --http.vhosts="*"
    #   --allow-insecure-unlock 

    # command:  geth export backup01 && sleep 30
    command:  sleep 3000
    ports:
      - 8545:8545
      - 8546:8546
      - 30303:30303
    healthcheck:
      test: ["CMD", "geth", "--exec", "net.listening", "attach", "http://localhost:8545"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
      start_interval: 5s
    volumes:
      - geth-datadir:/root/.ethereum

      # TODO: implement health-check if supported and possible

volumes:
  geth-datadir:

